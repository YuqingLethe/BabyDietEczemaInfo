spring:
  application:
    name: BabyDietEczemaInfo
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true # 开启 H2 的网页端管理页面
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update # 自动建表/更新表结构
    show-sql: true # 在控制台打印 SQL 语句，方便调试